[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoprover-codex"
version = "0.4.1"
description = "Codex app-server backend for facebookresearch/RepoProver"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Itskov"}]
dependencies = [
    "networkx>=3.4,<4",
    "pylatexenc>=2.10,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
repoprover = ["repoprover>=0.1.0"]
dev = ["pytest>=8"]

[project.scripts]
repoprover-codex = "repoprover_codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repoprover_codex.lean" = ["*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
