[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-assistant"
version = "0.1.0"
description = "Incremental formal verification and clarification for LaTeX manuscripts"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Itskov"}]
dependencies = [
    "networkx>=3.4,<4",
    "psutil>=7,<8",
    "pylatexenc>=2.10,<3",
    "PyYAML>=6,<7",
    "rich>=13,<15",
    "textual>=1,<2",
]

[project.optional-dependencies]
repoprover = ["repoprover>=0.1.0"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
proof-assistant = "proof_assistant.cli:main"
repoprover-codex = "proof_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"proof_assistant.lean" = ["*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
