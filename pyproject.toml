[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoprover-codex"
version = "0.1.0"
description = "Codex app-server backend for facebookresearch/RepoProver"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vladimir Itskov"}]
dependencies = []

[project.optional-dependencies]
repoprover = ["repoprover>=0.1.0"]
dev = ["pytest>=8"]

[project.scripts]
repoprover-codex = "repoprover_codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
