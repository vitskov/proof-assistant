[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-assistant"
version = "0.1.0"
description = "Incremental formal verification and clarification for LaTeX manuscripts"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Itskov"}]
dependencies = [
    "keyring>=25,<26",
    "networkx>=3.4,<4",
    "psutil>=7,<8",
    "pylatexenc>=2.10,<3",
    "PyYAML>=6,<7",
    "rich>=14.2,<15",
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
repoprover = ["repoprover>=0.1.0"]
dev = [
    "mypy>=1.20,<2",
    "pytest>=8",
    "pytest-textual-snapshot==1.1.0",
    "ruff>=0.12",
    "textual-dev>=1.8,<2",
    "types-networkx>=3.6",
    "types-psutil>=7.2",
    "types-PyYAML>=6",
]

[project.scripts]
proof-assistant = "proof_assistant.cli:main"
repoprover-codex = "proof_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"proof_assistant" = ["py.typed"]
"proof_assistant.lean" = ["*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src/proof_assistant"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["keyring.*", "pylatexenc.*", "repoprover.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["proof_assistant.manuscript", "proof_assistant.incremental.agent"]
allow_subclassing_any = true
