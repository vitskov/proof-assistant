name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Locked Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Bootstrap checksum-verified uv 0.12.0
        shell: bash
        run: |
          uv_bin="$(scripts/bootstrap-uv.sh "$RUNNER_TEMP/proof-assistant-uv")"
          printf 'UV_BIN=%s\n' "$uv_bin" >> "$GITHUB_ENV"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          installer="$RUNNER_TEMP/elan-init.sh"
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o "$installer"
          sh "$installer" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"

      - name: Compile-and-execute compiler preflight
        shell: bash
        run: |
          preflight_dir="$(mktemp -d)"
          trap 'rm -rf "$preflight_dir"' EXIT
          printf '%s\n' '#include <stdio.h>' 'int main(void) { puts("compiler-ok"); return 0; }' > "$preflight_dir/preflight.c"
          "${CC:-cc}" "$preflight_dir/preflight.c" -o "$preflight_dir/preflight"
          "$preflight_dir/preflight"

      - name: Install hash-locked development environment
        shell: bash
        run: |
          "$UV_BIN" venv --python 3.13 .venv
          "$UV_BIN" pip install --python .venv/bin/python --require-hashes \
            --only-binary=:all: -r requirements/py313-build.lock
          "$UV_BIN" pip sync --python .venv/bin/python --require-hashes --strict \
            --no-build-isolation requirements/py313-dev.lock
          "$UV_BIN" pip install --python .venv/bin/python --no-deps \
            --no-build-isolation -e .
          "$UV_BIN" pip check --python .venv/bin/python
          mkdir -p artifacts
          "$UV_BIN" pip freeze --python .venv/bin/python | LC_ALL=C sort \
            > "artifacts/resolved-before-${RUNNER_OS}.txt"
          .venv/bin/python - <<'PY' > "artifacts/tool-versions-${RUNNER_OS}.txt"
          from importlib.metadata import version
          for package in ("textual", "rich", "textual-dev", "pytest-textual-snapshot"):
              print(f"{package}=={version(package)}")
          PY

      - name: Validate Lean compiler integration
        shell: bash
        run: env -u LEAN_CC .venv/bin/proof-assistant compiler-check
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Strict type check
        shell: bash
        run: |
          .venv/bin/python scripts/check_typing_policy.py
          .venv/bin/mypy
      - name: Test
        run: .venv/bin/pytest -q

      - name: Verify test tooling did not mutate dependencies
        if: always()
        shell: bash
        run: |
          "$UV_BIN" pip freeze --python .venv/bin/python | LC_ALL=C sort \
            > "artifacts/resolved-after-${RUNNER_OS}.txt"
          diff -u "artifacts/resolved-before-${RUNNER_OS}.txt" \
            "artifacts/resolved-after-${RUNNER_OS}.txt"

      - name: Upload dependency and snapshot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: locked-test-evidence-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            artifacts/
            snapshot_report.html
            snapshot_report/
            tests/__snapshots__/**/*.svg

  latest-within-major:
    name: Latest within major / ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Bootstrap checksum-verified uv 0.12.0
        shell: bash
        run: |
          uv_bin="$(scripts/bootstrap-uv.sh "$RUNNER_TEMP/proof-assistant-uv")"
          printf 'UV_BIN=%s\n' "$uv_bin" >> "$GITHUB_ENV"
      - name: Resolve latest versions within declared major bounds
        shell: bash
        run: |
          "$UV_BIN" venv --python 3.13 .venv
          "$UV_BIN" pip install --python .venv/bin/python --upgrade -e ".[dev]"
          "$UV_BIN" pip check --python .venv/bin/python
          mkdir -p artifacts
          "$UV_BIN" pip freeze --python .venv/bin/python | LC_ALL=C sort \
            > "artifacts/canary-resolution-${RUNNER_OS}.txt"
      - name: Run compatibility canary
        run: .venv/bin/pytest -q tests/test_tui*.py
      - name: Upload canary resolution and snapshot differences
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: latest-within-major-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            artifacts/
            snapshot_report.html
            snapshot_report/
            tests/__snapshots__/**/*.svg
