name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          installer="$RUNNER_TEMP/elan-init.sh"
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o "$installer"
          sh "$installer" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"

      - name: Compile-and-execute compiler preflight
        shell: bash
        run: |
          preflight_dir="$(mktemp -d)"
          trap 'rm -rf "$preflight_dir"' EXIT
          printf '%s\n' '#include <stdio.h>' 'int main(void) { puts("compiler-ok"); return 0; }' > "$preflight_dir/preflight.c"
          "${CC:-cc}" "$preflight_dir/preflight.c" -o "$preflight_dir/preflight"
          "$preflight_dir/preflight"

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Validate Lean compiler integration
        shell: bash
        run: env -u LEAN_CC .venv/bin/proof-assistant compiler-check
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Strict type check
        run: |
          uv run --no-sync python scripts/check_typing_policy.py
          uv run --no-sync mypy
      - name: Test
        run: uv run --no-sync pytest -q
