name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"

      - name: Compile-and-execute compiler preflight
        shell: bash
        run: |
          preflight_dir="$(mktemp -d)"
          trap 'rm -rf "$preflight_dir"' EXIT
          printf '%s\n' '#include <stdio.h>' 'int main(void) { puts("compiler-ok"); return 0; }' > "$preflight_dir/preflight.c"
          "${CC:-cc}" "$preflight_dir/preflight.c" -o "$preflight_dir/preflight"
          "$preflight_dir/preflight"

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Test
        run: uv run --no-sync pytest -q
